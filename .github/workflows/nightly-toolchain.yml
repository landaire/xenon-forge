name: Nightly toolchain

on:
  # GitHub delays or drops scheduled runs at the start of the hour.
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild an already-published source commit
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-toolchain
  cancel-in-progress: false

# The large archive is published under an immutable toolchain-input tag. The
# moving `toolchain-nightly` release contains only its manifest and DotSlash /
# Buck2 pins. The generated `nightly-toolchain` branch is rebuilt from the
# default branch plus one pin commit, so that commit consumes the archive it
# names without changing the default branch or retriggering this workflow.

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      bootstrap_commit: ${{ steps.fingerprint.outputs.bootstrap_commit }}
      changed: ${{ steps.compare.outputs.changed }}
      head: ${{ steps.head.outputs.head }}
      llvm_commit: ${{ steps.fingerprint.outputs.llvm_commit }}
      release_tag: ${{ steps.fingerprint.outputs.release_tag }}
      rust_commit: ${{ steps.fingerprint.outputs.rust_commit }}
      toolchain_key: ${{ steps.fingerprint.outputs.toolchain_key }}
    steps:
      - name: Resolve the default branch
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch=$(gh api "repos/$GH_REPO" --jq .default_branch)
          head=$(gh api "repos/$GH_REPO/commits/$branch" --jq .sha)
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.head.outputs.head }}

      - name: Read the bootstrap commit
        id: bootstrap
        run: |
          commit=$(python3 - <<'PY'
          import configparser
          config = configparser.ConfigParser()
          config.read(".buckconfig")
          print(config["external_cell_rustc_bootstrap"]["commit_hash"])
          PY
          )
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: landaire-contrib/buck2-rustc-bootstrap
          ref: ${{ steps.bootstrap.outputs.commit }}
          path: toolchain/buck2-rustc-bootstrap

      - name: Compute the toolchain input fingerprint
        id: fingerprint
        run: |
          python3 src/tools/toolchain_fingerprint.py \
            --bootstrap-root toolchain/buck2-rustc-bootstrap \
            --output "$RUNNER_TEMP/toolchain-inputs.json"
          for name in bootstrap_commit llvm_commit rust_commit toolchain_key; do
            value=$(jq -r --arg name "$name" '.[$name]' \
              "$RUNNER_TEMP/toolchain-inputs.json")
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          done
          key=$(jq -r .toolchain_key "$RUNNER_TEMP/toolchain-inputs.json")
          echo "release_tag=toolchain-nightly-${key:0:12}" >> "$GITHUB_OUTPUT"

      - name: Compare with the latest toolchain
        id: compare
        env:
          FORCE: ${{ inputs.force || false }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOOLCHAIN_KEY: ${{ steps.fingerprint.outputs.toolchain_key }}
        run: |
          published=""
          scratch=$(mktemp -d)
          if gh release download toolchain-nightly \
              --pattern xbox360-toolchain.json --dir "$scratch" >/dev/null 2>&1; then
            published=$(jq -r '.toolchain_key // ""' \
              "$scratch/xbox360-toolchain.json")
          fi
          rm -rf "$scratch"

          if [ "$FORCE" != "true" ] && [ "$published" = "$TOOLCHAIN_KEY" ]; then
            echo "The nightly toolchain already contains $TOOLCHAIN_KEY."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            dotslash: .tools/bin/dotslash
            exe: ""
            jobs: 2
          - host: aarch64-apple-darwin
            runner: macos-14
            dotslash: .tools/bin/dotslash
            exe: ""
            jobs: 3
          - host: x86_64-pc-windows-msvc
            runner: windows-2022
            dotslash: .tools/bin/dotslash.exe
            exe: .exe
            jobs: 4
    defaults:
      run:
        shell: bash
    steps:
      # The toolchain inputs are digests of the files as the check job sees
      # them, with LF line endings.
      - name: Check out files unchanged
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.head }}

      - uses: actions/checkout@v4
        with:
          repository: landaire-contrib/buck2-rustc-bootstrap
          ref: ${{ needs.check.outputs.bootstrap_commit }}
          path: toolchain/buck2-rustc-bootstrap

      # Build the PPC64 toolchain from the checked-out bootstrap cell rather
      # than downloading the published one.
      - name: Use the checked-out bootstrap cell
        run: |
          cat > .buckconfig.local <<'EOF'
          [external_cells]
            rustc_bootstrap = disabled

          [xbox360]
            ppc64_toolchain = source
          EOF

      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Enable long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 1

      # Each run saves the build tree under its own key, so that a run which
      # stopped partway does not keep a later run from saving a complete one.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/buck2-rustc-bootstrap/xbox360-llvm
          key: xbox360-llvm-${{ runner.os }}-${{ needs.check.outputs.bootstrap_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            xbox360-llvm-${{ runner.os }}-${{ needs.check.outputs.bootstrap_commit }}-
            xbox360-llvm-${{ runner.os }}-

      # The bootstrap script and Buck2 actions need Python 3.11 or later;
      # Ubuntu 22.04 ships 3.10.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DotSlash and Buck2
        if: runner.os != 'Windows'
        run: ./bootstrap.sh

      - name: Install DotSlash and Buck2
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bootstrap.ps1

      # Buck2 through DotSlash, as bin/buck2 and bin/buck2.cmd run it.
      - name: Build Rust and LLVM distributions
        id: build
        # Ends before the job does, so that the next step saves the LLVM
        # build tree.
        timeout-minutes: 320
        env:
          DOTSLASH: ${{ matrix.dotslash }}
          JOBS: ${{ matrix.jobs }}
        run: |
          build() {
            "$DOTSLASH" toolchains/buck2 build -j "$JOBS" \
              -c xbox360.toolchain_jobs="$JOBS" \
              -m ppc64-ilp32 \
              "$1" --show-simple-output
          }
          rust_dist=$(build toolchains//:rust-ppc64)
          llvm_dist=$(build toolchains//:llvm-ppc64)
          echo "rust_dist=$rust_dist" >> "$GITHUB_OUTPUT"
          echo "llvm_dist=$llvm_dist" >> "$GITHUB_OUTPUT"

      # A build that timed out leaves the daemon writing to the LLVM tree.
      - name: Stop Buck2
        if: always()
        env:
          DOTSLASH: ${{ matrix.dotslash }}
        run: |
          if [ -e "$DOTSLASH" ]; then
            "$DOTSLASH" toolchains/buck2 kill
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/buck2-rustc-bootstrap/xbox360-llvm
          key: xbox360-llvm-${{ runner.os }}-${{ needs.check.outputs.bootstrap_commit }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record and verify the toolchain inputs
        env:
          EXPECTED: ${{ needs.check.outputs.toolchain_key }}
        run: |
          mkdir -p dist
          python src/tools/toolchain_fingerprint.py \
            --bootstrap-root toolchain/buck2-rustc-bootstrap \
            --output "$RUNNER_TEMP/toolchain-inputs.json"
          actual=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["toolchain_key"])' \
            "$RUNNER_TEMP/toolchain-inputs.json")
          if [ "$actual" != "$EXPECTED" ]; then
            echo "Toolchain inputs changed between check and build." >&2
            exit 1
          fi

      - name: Package the toolchain
        env:
          DOTSLASH: ${{ matrix.dotslash }}
          HOST: ${{ matrix.host }}
          LLVM_DIST: ${{ steps.build.outputs.llvm_dist }}
          RUST_DIST: ${{ steps.build.outputs.rust_dist }}
          SOURCE_COMMIT: ${{ needs.check.outputs.head }}
        run: |
          # The compiler links the C++ runtime of the Linux toolchain that
          # built it; macOS and Windows provide theirs.
          runtime=()
          if [ "$RUNNER_OS" = Linux ]; then
            runtime+=(--runtime-library "$(c++ -print-file-name=libstdc++.so.6)")
            runtime+=(--runtime-library "$(c++ -print-file-name=libgcc_s.so.1)")
          fi
          epoch=$(git show -s --format=%ct "$SOURCE_COMMIT")
          python src/tools/package_toolchain.py package \
            --host "$HOST" \
            --rust-dist "$RUST_DIST" \
            --llvm-dist "$LLVM_DIST" \
            --target-spec targets/powerpc64-unknown-xbox360-ilp32.json \
            --out-dir dist \
            --source-commit "$SOURCE_COMMIT" \
            --toolchain-inputs "$RUNNER_TEMP/toolchain-inputs.json" \
            --source-date-epoch "$epoch" \
            --dotslash "$DOTSLASH" \
            "${runtime[@]}"

      - name: Smoke-test the packaged tools
        env:
          EXE: ${{ matrix.exe }}
          HOST: ${{ matrix.host }}
        run: |
          python - <<'EOF'
          import os, tarfile
          from pathlib import Path
          host = os.environ["HOST"]
          archive = next(Path("dist").glob(f"xbox360-toolchain-{host}.tar.*"))
          with tarfile.open(archive) as source:
              source.extractall("extracted", filter="tar")
          EOF
          root=extracted/xbox360-toolchain-$HOST/bin
          "$root/rustc$EXE" --version --verbose
          "$root/rustdoc$EXE" --version
          "$root/clippy-driver$EXE" --version
          "$root/clang$EXE" --version
          "$root/clang++$EXE" --version
          "$root/ld.lld$EXE" --version

          printf 'pub fn answer() -> u32 { 42 }\n' > "$RUNNER_TEMP/smoke.rs"
          "$root/rustc$EXE" --crate-type=lib --emit=obj \
            "$RUNNER_TEMP/smoke.rs" -o "$RUNNER_TEMP/smoke-rust.o"
          printf 'unsigned answer(void) { return 42; }\n' > "$RUNNER_TEMP/smoke.c"
          "$root/clang$EXE" --target=powerpc64-unknown-xbox360-ilp32 \
            -c "$RUNNER_TEMP/smoke.c" -o "$RUNNER_TEMP/smoke-c.o"
          "$root/llvm-objdump$EXE" -h "$RUNNER_TEMP/smoke-c.o"

      - uses: actions/upload-artifact@v4
        with:
          name: xbox360-toolchain-${{ matrix.host }}
          path: dist/xbox360-toolchain-${{ matrix.host }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.head }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: xbox360-toolchain-*
          path: dist
          merge-multiple: true

      - name: Combine the host toolchains
        env:
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          python3 src/tools/package_toolchain.py release \
            --hosts-dir dist \
            --out-dir dist \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG"

      - name: Install DotSlash
        run: ./bootstrap.sh

      - name: Check the DotSlash descriptors
        run: |
          for descriptor in dist/dotslash/*; do
            .tools/bin/dotslash -- parse "$descriptor" >/dev/null
          done

      - name: Publish the immutable toolchain release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.check.outputs.head }}
        run: |
          assets=(
            dist/xbox360-toolchain-*.tar.*
            dist/xbox360-toolchain-*.buckconfig
            dist/xbox360-toolchain.json
            dist/nightly_toolchain.bzl
            dist/dotslash/*
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --prerelease \
              --target "$SOURCE_COMMIT" \
              --title "Xbox 360 toolchain ${SOURCE_COMMIT:0:12}" \
              --notes "Nightly Xbox 360 Rust and LLVM toolchain built from $SOURCE_COMMIT."
          fi

      - name: Publish the generated consumer commit
        id: consumer
        env:
          SOURCE_COMMIT: ${{ needs.check.outputs.head }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin refs/heads/nightly-toolchain:refs/remotes/origin/nightly-toolchain || true
          git switch -C nightly-toolchain "$SOURCE_COMMIT"
          cp dist/nightly_toolchain.bzl buck/nightly_toolchain.bzl
          cp dist/dotslash/* toolchains/
          cp dist/xbox360-toolchain.json toolchains/xbox360-toolchain.json
          git add buck/nightly_toolchain.bzl toolchains/xbox360-*
          git commit -m "Update nightly toolchain"
          git push --force-with-lease origin HEAD:refs/heads/nightly-toolchain
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Replace the moving nightly release
        env:
          CONSUMER_COMMIT: ${{ steps.consumer.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view toolchain-nightly >/dev/null 2>&1; then
            gh release delete toolchain-nightly --yes
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/toolchain-nightly" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/toolchain-nightly"
          fi
          gh release create toolchain-nightly \
            dist/nightly_toolchain.bzl \
            dist/dotslash/* \
            dist/xbox360-toolchain-*.buckconfig \
            dist/xbox360-toolchain.json \
            --prerelease \
            --target "$CONSUMER_COMMIT" \
            --title "Latest Xbox 360 nightly toolchain" \
            --notes "The nightly-toolchain branch at $CONSUMER_COMMIT consumes this build."
