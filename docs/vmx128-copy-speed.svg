<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 325" width="900" height="325" role="img" aria-label="Scalar, classic AltiVec, and VMX128 vector copy throughput comparison">
  <style>
    svg { --fg: #24292f; --muted: #57606a; --border: #d0d7de; --c1: #e15759; --c2: #4e79a7; --c3: #59a14f; }
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: var(--fg); }
    .title { font-size: 18px; font-weight: 600; }
    .muted { fill: var(--muted); }
    .scalar { fill: var(--c1); }
    .classic { fill: var(--c2); }
    .vmx { fill: var(--c3); }
    .axis { stroke: var(--border); stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      svg { --fg: #e6edf3; --muted: #8d96a0; --border: #30363d; --c1: #ff7b72; --c2: #79c0ff; --c3: #7ee787; }
    }
  </style>

  <text class="title" x="20" y="28">Copy throughput</text>
  <text class="muted" x="20" y="50">Vector loads more than double cached scalar throughput; large copies are memory-bound</text>

  <text x="205" y="108" text-anchor="end">16 KiB, cached</text>
  <rect class="scalar" x="220" y="68" width="230" height="24" rx="3"/>
  <rect class="classic" x="220" y="98" width="524" height="24" rx="3"/>
  <rect class="vmx" x="220" y="128" width="524" height="24" rx="3"/>
  <text x="460" y="86">Scalar 11.528 GB/s</text>
  <text x="754" y="116">Classic 26.210 GB/s</text>
  <text x="754" y="146">VMX128 26.224 GB/s</text>

  <text x="205" y="228" text-anchor="end">16 MiB</text>
  <rect class="scalar" x="220" y="188" width="492" height="24" rx="3"/>
  <rect class="classic" x="220" y="218" width="524" height="24" rx="3"/>
  <rect class="vmx" x="220" y="248" width="522" height="24" rx="3"/>
  <text x="722" y="206">Scalar 0.320 B/cycle</text>
  <text x="754" y="236">Classic 0.341 B/cycle</text>
  <text x="752" y="266">VMX128 0.340 B/cycle</text>

  <line class="axis" x1="220" y1="284" x2="744" y2="284"/>
  <rect class="scalar" x="255" y="298" width="14" height="14" rx="2"/>
  <text x="277" y="310">Scalar lwz / stw</text>
  <rect class="classic" x="430" y="298" width="14" height="14" rx="2"/>
  <text x="452" y="310">Classic AltiVec</text>
  <rect class="vmx" x="595" y="298" width="14" height="14" rx="2"/>
  <text x="617" y="310">VMX128 high registers</text>
</svg>
