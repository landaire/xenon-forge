<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 356" width="910" height="356" role="img" aria-label="Scalar, classic AltiVec, and VMX128 compute speed comparison">
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #24292f; }
  .title { font-size: 15px; font-weight: 600; }
  .muted { fill: #57606a; }
  .grid { stroke: #d0d7de; stroke-width: 1; }
  .axis { stroke: #8c959f; stroke-width: 1; }
  .scalar { fill: #e15759; } .classic { fill: #4e79a7; } .vmx { fill: #59a14f; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; } .muted { fill: #8d96a0; } .grid { stroke: #30363d; } .axis { stroke: #6e7681; }
    .scalar { fill: #ff7b72; } .classic { fill: #79c0ff; } .vmx { fill: #7ee787; }
  }
</style>
<text class="title" x="10" y="22">Compiler-generated compute speed</text>
<text class="muted" x="10" y="42">Same scalar C source, 1024 aligned elements; speed relative to the scalar build</text>

<line class="grid" x1="230" y1="52" x2="230" y2="318"/>
<text class="muted" x="230" y="336" text-anchor="middle">0×</text>
<line class="grid" x1="370" y1="52" x2="370" y2="318"/>
<text class="muted" x="370" y="336" text-anchor="middle">1×</text>
<line class="grid" x1="510" y1="52" x2="510" y2="318"/>
<text class="muted" x="510" y="336" text-anchor="middle">2×</text>
<line class="grid" x1="650" y1="52" x2="650" y2="318"/>
<text class="muted" x="650" y="336" text-anchor="middle">3×</text>
<line class="grid" x1="790" y1="52" x2="790" y2="318"/>
<text class="muted" x="790" y="336" text-anchor="middle">4×</text>
<text class="muted" x="510" y="352" text-anchor="middle">Speedup</text>

<text x="220" y="77.5" text-anchor="end">SAXPY — scalar</text>
<rect class="scalar" x="230" y="64" width="140" height="18"/>
<text x="376" y="77.5">1.00×</text>
<text x="220" y="101.5" text-anchor="end">SAXPY — classic AltiVec</text>
<rect class="classic" x="230" y="88" width="210" height="18"/>
<text x="446" y="101.5">1.50×</text>
<text x="220" y="125.5" text-anchor="end">SAXPY — VMX128</text>
<rect class="vmx" x="230" y="112" width="224" height="18"/>
<text x="460" y="125.5">1.60×</text>

<text x="220" y="165.5" text-anchor="end">Dot product — scalar</text>
<rect class="scalar" x="230" y="152" width="140" height="18"/>
<text x="376" y="165.5">1.00×</text>
<text x="220" y="189.5" text-anchor="end">Dot product — classic AltiVec</text>
<rect class="classic" x="230" y="176" width="368" height="18"/>
<text x="604" y="189.5">2.63×</text>
<text x="220" y="213.5" text-anchor="end">Dot product — VMX128</text>
<rect class="vmx" x="230" y="200" width="560" height="18"/>
<text x="796" y="213.5">4.00×</text>

<text x="220" y="253.5" text-anchor="end">4×4 transform — scalar</text>
<rect class="scalar" x="230" y="240" width="140" height="18"/>
<text x="376" y="253.5">1.00×</text>
<text x="220" y="277.5" text-anchor="end">4×4 transform — classic AltiVec</text>
<rect class="classic" x="230" y="264" width="225" height="18"/>
<text x="461" y="277.5">1.61×</text>
<text x="220" y="301.5" text-anchor="end">4×4 transform — VMX128</text>
<rect class="vmx" x="230" y="288" width="199" height="18"/>
<text x="435" y="301.5">1.42×</text>

<line class="axis" x1="230" y1="52" x2="230" y2="318"/>
</svg>
