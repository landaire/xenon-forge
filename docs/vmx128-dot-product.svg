<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Classic AltiVec five-instruction dot-product sequence compared with one VMX128 dot-product instruction">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: currentColor; }
    .title { font-size: 18px; font-weight: 600; }
    .label { font-size: 15px; font-weight: 600; }
    .muted { opacity: 0.68; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; rx: 6; }
    .classic { opacity: 0.62; }
    .vmx { stroke-width: 2.5; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) { svg { filter: invert(1); } }
  </style>

  <text class="title" x="20" y="28">Four-component dot product</text>
  <text class="muted" x="20" y="50">VMX128 replaces a dependency chain with one instruction</text>

  <text class="label" x="20" y="82">Classic AltiVec</text>
  <g class="classic">
    <rect class="box" x="20" y="96" width="82" height="44"/>
    <rect class="box" x="126" y="96" width="82" height="44"/>
    <rect class="box" x="232" y="96" width="82" height="44"/>
    <rect class="box" x="338" y="96" width="82" height="44"/>
    <rect class="box" x="444" y="96" width="82" height="44"/>
    <path class="arrow" d="M102 118 H120"/>
    <path class="arrow" d="M208 118 H226"/>
    <path class="arrow" d="M314 118 H332"/>
    <path class="arrow" d="M420 118 H438"/>
    <text x="61" y="123" text-anchor="middle">step 1</text>
    <text x="167" y="123" text-anchor="middle">step 2</text>
    <text x="273" y="123" text-anchor="middle">step 3</text>
    <text x="379" y="123" text-anchor="middle">step 4</text>
    <text x="485" y="123" text-anchor="middle">step 5</text>
  </g>
  <text class="muted" x="20" y="162">Five dependent instructions</text>

  <text class="label" x="600" y="82">VMX128</text>
  <rect class="box vmx" x="600" y="96" width="250" height="44"/>
  <text x="725" y="123" text-anchor="middle">vmsum4fp128</text>
  <text class="muted" x="600" y="162">One dot-product instruction</text>

  <path class="arrow" d="M526 118 H584"/>
  <text class="muted" x="450" y="210" text-anchor="middle">Shorter dependency chain increases dot-product throughput</text>
</svg>
