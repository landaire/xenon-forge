<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="Classic AltiVec 32-register file compared with the VMX128 128-register file">
  <defs>
    <pattern id="classic-cells" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="17" height="17" rx="2" fill="currentColor" opacity="0.24"/>
    </pattern>
    <pattern id="vmx-cells" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="12" height="12" rx="2" fill="currentColor" opacity="0.42"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: currentColor; }
    .title { font-size: 18px; font-weight: 600; }
    .label { font-size: 15px; font-weight: 600; }
    .muted { opacity: 0.68; }
    .frame { fill: none; stroke: currentColor; stroke-width: 1.5; opacity: 0.55; }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.5; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) { svg { filter: invert(1); } }
  </style>

  <text class="title" x="20" y="28">Vector register file</text>
  <text class="muted" x="20" y="50">More registers allow more independent vectors to stay in flight</text>

  <text class="label" x="80" y="84">Classic AltiVec</text>
  <rect class="frame" x="80" y="98" width="176" height="88" rx="5"/>
  <rect x="80" y="98" width="176" height="88" fill="url(#classic-cells)"/>
  <text x="168" y="215" text-anchor="middle">32 vector registers</text>

  <path class="arrow" d="M300 142 H448"/>
  <text class="muted" x="374" y="126" text-anchor="middle">4× capacity</text>

  <text class="label" x="500" y="84">VMX128</text>
  <rect class="frame" x="500" y="98" width="256" height="128" rx="5"/>
  <rect x="500" y="98" width="256" height="128" fill="url(#vmx-cells)"/>
  <text x="628" y="255" text-anchor="middle">128 vector registers</text>

  <text class="muted" x="450" y="282" text-anchor="middle">Larger kernels can unroll further without spilling registers</text>
</svg>
